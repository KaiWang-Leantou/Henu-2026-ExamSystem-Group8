# ============================================================
# MySQL 5.6.16 配置（团队共享版）
# ------------------------------------------------------------
# 【端口说明】本项目使用 3306。
#   前提：本机若另装过 MySQL（例如 D:\MYSQL 的 MySQL267 服务），
#         必须把它停掉，否则端口冲突、本项目的 mysqld 起不来。
#         停止命令（管理员 CMD）：  net stop MySQL267
#         取消开机自启（管理员）：  sc config MySQL267 start= disabled
#
#   如果你改了这里的端口，必须同步修改以下 4 处，缺一不可：
#     - 2-start.bat / xq-startup.bat       的 --port
#     - xq-shutdown.bat / 3-createdb.bat      的 -P
#     - webapps\exam\WEB-INF\applicationContext.xml  的 JDBC URL
#     - webapps\exam\WEB-INF\classes\applicationContext.xml（保险起见一起改）
#
# 【路径说明】这里故意不写 basedir / datadir。
#   原因：这两个值必须是绝对路径，而每个人的项目解压位置不同；
#         写死会导致除作者之外的人全都启动失败。
#   做法：由 1-init.bat / 2-start.bat / xq-startup.bat 在命令行
#         用 --basedir / --datadir 传入（命令行优先级高于本文件）。
# ============================================================

[client]
port=3306
default-character-set=utf8

[mysql]
default-character-set=utf8

[mysqld]
character_set_server=utf8

# 端口（与 [client] 保持一致）
port = 3306

# 允许的最大并发连接数，课程演示 200 足够
max_connections = 200

sql_mode=NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES

# ------------------------------------------------------------
# 如果确实需要在本文件里写死路径，请把下面两行的 # 去掉并改成你自己的
# 绝对路径（注意同时提供 basedir 和 datadir，且不要带末尾反斜杠）：
#
# basedir = D:/xxx/exam-bundle/mysql-5.6.16-win32
# datadir = D:/xxx/exam-bundle/mysql-5.6.16-win32/data
# ------------------------------------------------------------
